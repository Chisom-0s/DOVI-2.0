    <!-- Fallback Styling for Non-JS Crawlers & Pre-Hydration First Paint -->
    <style>
      :root {
        --color-primary: #ff7a00;
        --color-primary-hover: #e56e00;
        --color-bg: #ffffff;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #ffffff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }
      @keyframes doviPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.04); }
      }
      @keyframes doviDotBounce {
        0%, 80%, 100% { transform: scale(0.4); opacity: 0.35; }
        40% { transform: scale(1); opacity: 1; }
      }
      #dovi-initial-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100vh;
        background: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }
      .dovi-loader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
      }
      .dovi-loader-logo {
        width: 108px;
        height: 108px;
        border-radius: 24px;
        box-shadow: 0 12px 32px rgba(255, 122, 0, 0.22);
        object-fit: contain;
        margin-bottom: 14px;
        animation: doviPulse 2s infinite ease-in-out;
      }
      .dovi-loader-sub {
        margin: 0 0 24px 0;
        font-size: 16px;
        color: #4b5563;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .dovi-loader-dots {
        display: flex;
        align-items: center;
        gap: 8px;
        height: 16px;
      }
      .dovi-loader-dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background-color: #ff7a00;
        animation: doviDotBounce 1.4s infinite ease-in-out both;
      }
      .dovi-loader-dot:nth-child(1) { animation-delay: -0.32s; }
      .dovi-loader-dot:nth-child(2) { animation-delay: -0.16s; background-color: #ff9f43; }
      .dovi-loader-dot:nth-child(3) { animation-delay: 0s; }
      .dovi-loader-footer {
        position: absolute;
        bottom: 28px;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 13px;
        font-weight: 500;
        color: #9ca3af;
        letter-spacing: 0.2px;
        padding: 0 16px;
        box-sizing: border-box;
      }
    </style>

    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service Worker registered:', reg.scope);
              reg.update();
            })
            .catch((err) => console.error('Service Worker registration failed:', err));
        });
      }
    </script>
